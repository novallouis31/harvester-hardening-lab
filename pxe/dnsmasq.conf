# Extrait dnsmasq - DHCP + iPXE UEFI pour Harvester v1.10.
interface=eth0
listen-address=10.0.0.10,127.0.0.1
bind-interfaces

dhcp-range=10.0.0.100,10.0.0.200,12h
# OBLIGatoire : le noeud Harvester a besoin de sa route par defaut.
dhcp-option=option:router,10.0.0.10
dhcp-option=option:dns-server,10.0.0.1

dhcp-match=set:ipxe,175
dhcp-match=set:uefi,option:client-arch,7

# Deja dans iPXE -> script de creation ; sinon -> programme iPXE UEFI
dhcp-boot=tag:ipxe,http://10.0.0.10/harvester/ipxe-create
dhcp-boot=tag:!ipxe,tag:uefi,http://10.0.0.10/harvester/ipxe.efi
